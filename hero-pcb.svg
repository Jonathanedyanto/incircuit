<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Ilustrasi papan PCB dengan chip dan jalur tembaga">
  <rect width="640" height="480" fill="#0A1F44"/>
  <rect x="40" y="40" width="560" height="400" rx="20" fill="#0F3470" stroke="#14B8A6" stroke-width="3"/>

  <!-- lubang pemasangan -->
  <g fill="#0A1F44" stroke="#5EEAD4" stroke-width="3">
    <circle cx="72" cy="72" r="9"/><circle cx="568" cy="72" r="9"/>
    <circle cx="72" cy="408" r="9"/><circle cx="568" cy="408" r="9"/>
  </g>

  <!-- jalur tembaga -->
  <g fill="none" stroke="#14B8A6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M224 190 H180 L150 160 H100"/>
    <path d="M224 212 H100"/>
    <path d="M224 234 H180 L150 264 H100"/>
    <path d="M224 256 H200 L170 286 H100"/>
    <path d="M416 190 H460 L490 160 H540"/>
    <path d="M416 212 H540"/>
    <path d="M416 234 H460 L490 264 H540"/>
    <path d="M416 256 H440 L470 286 H540"/>
    <path d="M266 154 V130 H190"/>
    <path d="M310 154 V80"/>
    <path d="M354 154 V130 H430"/>
    <path d="M266 326 V350 H190"/>
    <path d="M310 326 V400"/>
    <path d="M354 326 V350 H430"/>
  </g>

  <!-- pad -->
  <g fill="#5EEAD4">
    <circle cx="100" cy="160" r="7"/><circle cx="100" cy="212" r="7"/>
    <circle cx="100" cy="264" r="7"/><circle cx="100" cy="286" r="7"/>
    <circle cx="540" cy="160" r="7"/><circle cx="540" cy="212" r="7"/>
    <circle cx="540" cy="264" r="7"/><circle cx="540" cy="286" r="7"/>
    <circle cx="190" cy="130" r="7"/><circle cx="310" cy="80" r="7"/><circle cx="430" cy="130" r="7"/>
    <circle cx="190" cy="350" r="7"/><circle cx="310" cy="400" r="7"/><circle cx="430" cy="350" r="7"/>
  </g>

  <!-- kaki chip -->
  <g stroke="#CBD5E1" fill="none">
    <line x1="232" y1="186" x2="232" y2="290" stroke-width="16" stroke-dasharray="8 14"/>
    <line x1="408" y1="186" x2="408" y2="290" stroke-width="16" stroke-dasharray="8 14"/>
    <line x1="262" y1="162" x2="362" y2="162" stroke-width="16" stroke-dasharray="8 14"/>
    <line x1="262" y1="318" x2="362" y2="318" stroke-width="16" stroke-dasharray="8 14"/>
  </g>

  <!-- badan chip -->
  <rect x="240" y="170" width="160" height="140" rx="8" fill="#061430" stroke="#5EEAD4" stroke-width="2"/>
  <circle cx="258" cy="188" r="4" fill="#5EEAD4"/>
  <text x="320" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#5EEAD4">MCU</text>

  <!-- komponen kecil -->
  <g fill="#061430" stroke="#5EEAD4" stroke-width="2">
    <rect x="70" y="350" width="40" height="18" rx="3"/>
    <rect x="530" y="350" width="40" height="18" rx="3"/>
  </g>
</svg>